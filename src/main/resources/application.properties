# =============================================================
# TrustMesh — application.properties (dev / default profile)
# For production overrides, use application-prod.properties
# =============================================================

spring.application.name=TrustMesh

# ---- Server ----
# Railway/Render sets PORT env var; fall back to 8080 locally
server.port=${PORT:8080}

# ---- Database (H2 in-memory, zero-setup for the demo) ----
spring.datasource.url=jdbc:h2:mem:upimesh
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Suppress the "open-in-view" warning (acceptable in demo context)
spring.jpa.open-in-view=false

# ---- H2 Web Console (dev only — disabled in prod profile) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Restrict H2 console to localhost connections only
spring.h2.console.settings.web-allow-others=false

# ---- Logging ----
logging.level.com.demo.upimesh=INFO
# Show which class/method each log line comes from
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ---- Business Configuration ----
# Idempotency cache: how long a packet hash is remembered before eviction.
# A real system would use Redis TTL here. In dev, the cache lives for the JVM lifetime.
upi.mesh.idempotency-ttl-seconds=86400

# Freshness window: packets older than this many seconds are rejected as replays.
# 24h matches UPI's real offline transaction expiry window.
upi.mesh.packet-max-age-seconds=86400

# Max number of hops a packet can travel before being dropped
upi.mesh.max-hops=10

# Enable HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ---- Spring Actuator ----
# Expose health, info, prometheus — keep others hidden
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Application info (shown at /actuator/info)
management.info.env.enabled=true
info.app.name=TrustMesh
info.app.description=Offline-First UPI Mesh Payment Engine
info.app.version=1.2.0
info.app.author=nims-creation

# Metrics — enable JVM, system, HTTP metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.http.server.requests=true

# Actuator base path (keep separate from API)
management.endpoints.web.base-path=/actuator

# ---- JWT Configuration (Bridge Node Authentication) ----
# Secret key for signing JWTs (min 32 chars for HS256)
# In production: inject via environment variable / AWS Secrets Manager
jwt.secret=TrustMesh-BridgeNode-SecretKey-2024-ChangeInProd!
# Token validity: 24h (matches UPI offline packet window)
jwt.expiration-ms=86400000

# ---- Resilience4j — Circuit Breaker for SettlementService ----
# Circuit breaker: opens after 50% failure rate in a 10-call sliding window
# Prevents DB failure storms from cascading into the entire ingestion pipeline
resilience4j.circuitbreaker.instances.settlementCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.settlementCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.settlementCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.settlementCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.settlementCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.settlementCB.automaticTransitionFromOpenToHalfOpenEnabled=true
# InsufficientFundsException and IllegalArgumentException are business-rule errors,
# NOT infrastructure failures — they must NOT count toward the circuit breaker failure rate.
# Without this, a single insufficient-funds rejection could trip the breaker in tests.
resilience4j.circuitbreaker.instances.settlementCB.ignoreExceptions[0]=com.demo.upimesh.service.InsufficientFundsException
resilience4j.circuitbreaker.instances.settlementCB.ignoreExceptions[1]=java.lang.IllegalArgumentException
# Only genuine infrastructure failures (DB, timeout, ORM) count as failures
resilience4j.circuitbreaker.instances.settlementCB.recordExceptions[0]=org.springframework.dao.DataAccessException
resilience4j.circuitbreaker.instances.settlementCB.recordExceptions[1]=org.springframework.orm.jpa.JpaSystemException
resilience4j.circuitbreaker.instances.settlementCB.recordExceptions[2]=java.util.concurrent.TimeoutException

# Retry: up to 3 attempts with 200ms wait for transient DB failures
# Does NOT retry on InsufficientFundsException (business rule — no retry on financial decisions)
resilience4j.retry.instances.settlementRetry.maxAttempts=3
resilience4j.retry.instances.settlementRetry.waitDuration=200ms
resilience4j.retry.instances.settlementRetry.retryExceptions[0]=org.springframework.orm.jpa.JpaSystemException
resilience4j.retry.instances.settlementRetry.retryExceptions[1]=org.springframework.dao.OptimisticLockingFailureException

# Expose circuit breaker metrics to Prometheus
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus,metrics,circuitbreakers
