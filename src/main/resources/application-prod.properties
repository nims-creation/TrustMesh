# =============================================================
# TrustMesh — application-prod.properties
# Production overrides — ALL sensitive values read from
# environment variables, never hardcoded.
#
# Required environment variables:
#   DB_URL        - PostgreSQL JDBC URL (e.g. jdbc:postgresql://host:5432/trustmesh)
#   DB_USERNAME   - Database username
#   DB_PASSWORD   - Database password (use a secrets manager, NOT a .env file)
#   JWT_SECRET    - Min-32-char random string (openssl rand -base64 64)
# =============================================================

# ---- PostgreSQL Database Configuration ----
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/trustmesh}
spring.datasource.username=${DB_USERNAME:trustmesh_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ---- Flyway Database Migrations ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ---- H2 Console — MUST be disabled in production ----
spring.h2.console.enabled=false

# ---- Error Handling — never leak internals in production ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ---- HTTP Response Compression ----
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ---- Logging — production level ----
logging.level.com.demo.upimesh=WARN
logging.level.root=WARN
